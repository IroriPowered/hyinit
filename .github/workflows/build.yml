name: Build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Check formatting
        run: git diff --exit-code
      - name: Resolve Hytale server JAR
        id: server
        run: echo "jar=$(./gradlew -q printHytaleServerJar)" >> "$GITHUB_OUTPUT"
      - name: Verify runtime behaviour
        run: bash scripts/verify-all.sh build/libs/Hyinit-*.jar "${{ steps.server.outputs.jar }}" "$JAVA_HOME" "$RUNNER_TEMP"
      - name: Capture verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Verification
          path: ${{ runner.temp }}/verify-*
          if-no-files-found: ignore
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
